<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>晶圆厂网络安全攻防 · Fab OT Defense</title>
<style>
:root{
  --bg:#080e1a; --panel:#0f1a2e; --panel2:#152541; --line:#1e3350;
  --txt:#e6edf6; --muted:#8098b8; --accent:#ffd166;
  --ok:#4cd964; --warn:#ff9f43; --bad:#ff4d6d; --cy:#5ec8f0;
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
  font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  overflow:hidden;user-select:none;}
#app{display:flex;flex-direction:column;height:100vh;}

header{display:flex;align-items:center;gap:12px;padding:8px 14px;
  background:linear-gradient(90deg,#0c1526,#122239);border-bottom:1px solid var(--line);
  flex:none;flex-wrap:wrap;}
.brand{font-size:15px;font-weight:800;letter-spacing:.5px;white-space:nowrap;}
.brand .sub{font-size:10px;color:var(--muted);font-weight:400;margin-left:6px;}
.hud{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:4px 10px;font-size:11px;white-space:nowrap;}
.chip b{font-size:14px;color:var(--accent);}
.bar{width:108px;height:9px;background:#0a1424;border:1px solid var(--line);
  border-radius:6px;overflow:hidden;margin-top:3px;}
.bar i{display:block;height:100%;transition:width .18s;}
.hp .bar i{background:linear-gradient(90deg,#ff4d6d,#ff9f43);}
.ap .bar i{background:linear-gradient(90deg,#2bd9c9,#4cd964);}
.yd .bar i{background:linear-gradient(90deg,#5ec8f0,#4cd964);}
.tools{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;}
.tools button{padding:5px 10px;border-radius:7px;border:1px solid var(--line);
  background:var(--panel);color:var(--txt);cursor:pointer;font-size:11px;transition:.15s;}
.tools button:hover{border-color:var(--accent);color:var(--accent);}
.tools button.on{background:var(--accent);color:#0b1220;border-color:var(--accent);}

main{flex:1;display:flex;min-height:0;}
#stage{flex:1;position:relative;overflow:hidden;
  background:radial-gradient(circle at 25% 12%,#0f2033 0,#080e1a 62%);}
#stage.hurt{animation:hurt .32s;}
@keyframes hurt{0%{box-shadow:inset 0 0 0 0 rgba(255,77,109,0);}
  40%{box-shadow:inset 0 0 90px 12px rgba(255,77,109,.5);}100%{box-shadow:inset 0 0 0 0 rgba(255,77,109,0);}}
svg{width:100%;height:100%;display:block;cursor:crosshair;}
svg.grabbing{cursor:grabbing;}

.zone-band{fill:rgba(255,255,255,.014);stroke:var(--line);stroke-width:1;stroke-dasharray:5 7;}
.zone-label{fill:#6d87a8;font-size:12px;font-weight:700;letter-spacing:1px;}
.edge{stroke:#243a58;stroke-width:1.4;fill:none;}
.edge.oneway{stroke-dasharray:6 4;}

.node{cursor:pointer;}
.node-box{fill:var(--panel2);stroke-width:1.6;transition:fill .12s,stroke .12s;}
.node:hover .node-box{fill:#1c3055;}
.node-icon{font-size:22px;text-anchor:middle;dominant-baseline:central;}
.node-label{font-size:14.5px;font-weight:700;fill:var(--txt);dominant-baseline:central;}
.node-tag{font-size:9.5px;fill:#7f96b6;dominant-baseline:central;}
.node-badge{font-size:16px;text-anchor:middle;dominant-baseline:central;}
.node.valid .node-box{stroke-width:3.4;}
.node.valid{animation:pulseV 1.1s ease-in-out infinite;}
@keyframes pulseV{0%,100%{opacity:1;}50%{opacity:.62;}}
.node.locate .node-box{stroke:#fff;stroke-width:4;}

.atk-path{stroke-width:2.4;fill:none;stroke-dasharray:8 7;opacity:.5;
  animation:dash 1.1s linear infinite;}
@keyframes dash{to{stroke-dashoffset:-15;}}
.atk-halo{opacity:.22;animation:halo 1.15s ease-in-out infinite;}
@keyframes halo{0%,100%{r:15;opacity:.28;}50%{r:24;opacity:.06;}}
.atk-dot{stroke:#fff;stroke-width:2;}
.atk-txt{font-size:12px;font-weight:700;text-anchor:middle;dominant-baseline:central;
  fill:#fff;paint-order:stroke;stroke:#000;stroke-width:3.5;}

#tip{position:absolute;pointer-events:none;background:rgba(8,14,26,.97);
  border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:12px;
  line-height:1.55;max-width:255px;z-index:20;display:none;box-shadow:0 8px 26px rgba(0,0,0,.6);}
#tip .t{font-weight:700;font-size:13px;margin-bottom:3px;}
#tip .vk{color:var(--warn);}
#tip .vs{color:var(--ok);}
#toast{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:25;
  display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;}
.toast{background:rgba(12,22,40,.97);border:1px solid var(--line);border-radius:8px;
  padding:7px 15px;font-size:12.5px;animation:tin .25s;box-shadow:0 6px 20px rgba(0,0,0,.5);
  max-width:420px;text-align:center;}
.toast.warn{border-color:var(--warn);color:var(--warn);}
.toast.ok{border-color:var(--ok);color:var(--ok);}
.toast.bad{border-color:var(--bad);color:var(--bad);}
@keyframes tin{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:none;}}
#phaseTag{position:absolute;top:12px;left:14px;z-index:15;font-size:12px;
  padding:5px 12px;border-radius:20px;border:1px solid var(--line);
  background:rgba(12,22,40,.9);pointer-events:none;}
#phaseTag.prep{border-color:var(--ok);color:var(--ok);}
#phaseTag.wave{border-color:var(--bad);color:var(--bad);animation:pulseV 1.2s infinite;}

aside{width:346px;flex:none;background:var(--panel);border-left:1px solid var(--line);
  display:flex;flex-direction:column;}
.sec{border-bottom:1px solid var(--line);display:flex;flex-direction:column;min-height:0;}
.sec-h{padding:7px 12px;font-size:11px;font-weight:800;letter-spacing:1px;
  color:var(--muted);background:#0c1526;display:flex;align-items:center;gap:6px;flex:none;}
.sec-h .n{margin-left:auto;color:var(--accent);}
#devInfo{padding:9px 12px;font-size:12px;line-height:1.6;flex:none;min-height:96px;}
#devInfo .nm{font-size:13.5px;font-weight:700;margin-bottom:3px;}
#devInfo .mut{color:var(--muted);}
.vchip{display:inline-block;font-size:10px;padding:1px 7px;border-radius:10px;
  margin:2px 3px 0 0;border:1px solid var(--warn);color:var(--warn);}
.vchip.ok{border-color:var(--ok);color:var(--ok);}
.otnote{margin-top:5px;font-size:11px;color:var(--cy);border-left:2px solid var(--cy);
  padding-left:7px;}

#threats{overflow-y:auto;padding:6px;flex:1;min-height:90px;}
.threat{display:flex;align-items:center;gap:8px;padding:6px 7px;border-radius:8px;
  background:#0c1526;border:1px solid var(--line);margin-bottom:5px;cursor:pointer;transition:.12s;}
.threat:hover{border-color:var(--accent);background:#132340;}
.threat.hid{border-style:dashed;border-color:var(--warn);}
.th-ic{font-size:17px;flex:none;width:22px;text-align:center;}
.th-main{flex:1;min-width:0;}
.th-t{font-size:11.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.th-t .ar{color:var(--muted);font-weight:400;}
.th-bar{height:5px;background:#08111f;border-radius:4px;overflow:hidden;margin-top:4px;}
.th-bar i{display:block;height:100%;width:0;}
.th-act{flex:none;background:#132340;border:1px solid var(--line);border-radius:7px;
  color:var(--txt);cursor:pointer;padding:3px 7px;font-size:11px;line-height:1.25;
  text-align:center;min-width:38px;}
.th-act:hover{border-color:var(--accent);color:var(--accent);}
.th-act b{display:block;font-size:9px;color:var(--muted);font-weight:400;}
#log{overflow-y:auto;padding:6px 10px;font-size:11.5px;line-height:1.5;flex:1;min-height:110px;}
#log div{padding:1.5px 0;border-bottom:1px solid rgba(255,255,255,.03);}
#log .ok{color:var(--ok);}#log .bad{color:var(--bad);}
#log .warn{color:var(--warn);}#log .info{color:var(--muted);}
.empty{color:var(--muted);font-size:11.5px;padding:8px;text-align:center;}

#cards{flex:none;display:flex;gap:7px;padding:8px 12px;background:#0c1526;
  border-top:1px solid var(--line);overflow-x:auto;align-items:stretch;}
.card{position:relative;flex:none;width:98px;background:var(--panel2);
  border:1.6px solid var(--line);border-radius:10px;padding:6px 4px 5px;cursor:pointer;
  text-align:center;overflow:hidden;transition:.13s;}
.card:hover{border-color:#3f5c85;transform:translateY(-2px);}
.card.armed{border-color:var(--accent);background:#22365a;transform:translateY(-3px);
  box-shadow:0 0 0 2px rgba(255,209,102,.25);}
.card.no{opacity:.38;}
.card .ck{position:absolute;top:2px;left:4px;font-size:9px;color:var(--muted);}
.card .ci{font-size:19px;line-height:1.1;}
.card .cn{font-size:11px;font-weight:700;margin-top:1px;}
.card .cc{font-size:9.5px;color:var(--muted);}
.card .cd{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.66);
  height:0;transition:height .12s;pointer-events:none;}
#cardTip{flex:none;padding:8px 12px;font-size:11px;color:var(--muted);
  border-left:1px solid var(--line);width:180px;line-height:1.5;}

#ov{position:fixed;inset:0;background:rgba(4,8,16,.9);z-index:60;display:none;
  align-items:center;justify-content:center;padding:22px;}
#ov.show{display:flex;}
#ovBox{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  max-width:900px;width:100%;max-height:88vh;overflow-y:auto;padding:22px 26px;}
#ovBox h2{margin:0 0 6px;font-size:21px;}
#ovBox h3{margin:16px 0 6px;font-size:13px;color:var(--accent);letter-spacing:1px;}
#ovBox p,#ovBox li{font-size:13px;line-height:1.75;color:#c8d6e8;}
#ovBox ul{margin:5px 0;padding-left:20px;}
.btnrow{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;}
.btn{padding:9px 20px;border-radius:9px;border:1px solid var(--accent);
  background:var(--accent);color:#0b1220;font-weight:700;cursor:pointer;font-size:13px;}
.btn.gh{background:transparent;color:var(--txt);border-color:var(--line);}
.btn:hover{filter:brightness(1.1);}
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px;}
th,td{border:1px solid var(--line);padding:5px 8px;text-align:left;}
th{background:#0c1526;color:var(--muted);font-size:11px;}
.kv2{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;margin-top:8px;}
.kv2 div{background:#0c1526;border:1px solid var(--line);border-radius:8px;padding:8px 11px;
  font-size:12.5px;}
.kv2 b{color:var(--accent);font-size:16px;display:block;}
.rank{font-size:52px;font-weight:900;text-align:center;margin:8px 0;}
.note{background:rgba(94,200,240,.08);border:1px solid rgba(94,200,240,.35);
  border-radius:8px;padding:10px 12px;font-size:12.5px;line-height:1.7;margin-top:10px;}
.note b{color:var(--cy);}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">🏭 晶圆厂攻防<span class="sub">Fab OT Security · IT/OT 融合安全演练</span></div>
    <div class="hud">
      <div class="chip">波次 <b id="hWave">0/6</b></div>

  <main>

      <div id="tip"></div>
      <div id="toast"></div>
    </div>

    <aside>
      <div class="sec">
        <div class="sec-h">🎯 选中设备</div>
        <div id="devInfo"><div class="empty">点击拓扑节点查看详情</div></div>
      </div>
      <div class="sec" style="flex:1.25">
        <div class="sec-h">🚨 活跃威胁<span class="n" id="thN">0</span></div>
        <div id="threats"><div class="empty">暂无活跃威胁</div></div>
      </div>
      <div class="sec" style="flex:1">
        <div class="sec-h">📜 事件日志</div>
        <div id="log"></div>
      </div>
    </aside>
  </main>

  <div id="cards"></div>
  <div id="ov"><div id="ovBox"></div></div>
</div>

<script>

function log(msg,cls='info'){
  const d=document.createElement('div');
  d.className=cls; d.textContent=`[${(G.t/1000).toFixed(0).padStart(3,'0')}s] ${msg}`;
  const L=$('#log'); L.appendChild(d);
  while(L.children.length>150)L.removeChild(L.firstChild);
  L.scrollTop=L.scrollHeight;
}
function toast(msg,cls=''){
  const d=document.createElement('div'); d.className='toast '+cls; d.textContent=msg;
  $('#toast').appendChild(d);
  setTimeout(()=>d.remove(),2600);
}
let lastFlash=-9999;
function flash(){
  if(G.t-lastFlash<420)return;
  lastFlash=G.t;
  $('#stage').classList.remove('hurt');void $('#stage').offsetWidth;
  $('#stage').classList.add('hurt');
}
function damage(v){
  if(v<=0)return;
  G.hp=Math.max(0,G.hp-v);G.combo=0;flash();
  if(G.hp<=0&&G.phase!=='over'&&G.phase!=='menu')gameOver(false,'产线全面停产');
}
function bumpYield(v){
  if(!v)return;
  const before=G.yield;
  G.yield=Math.max(0,Math.min(100,G.yield+v));
  if(v<0){G.stats.yieldLost+=(before-G.yield);G.combo=0;}
  if(G.yield<=YIELD_FAIL&&G.phase!=='over'&&G.phase!=='menu')
    gameOver(false,'良率崩盘');
}
function comboMul(){return Math.min(2,1+G.combo*0.05);}
function score(v){G.score=Math.max(0,G.score+Math.round(v*comboMul()));}

let ac=null;
function sfx(f,dur,type='sine',vol=.05){
  if(!G.sfx)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain();
    o.type=type;o.frequency.value=f;g.gain.value=vol;
    o.connect(g);g.connect(ac.destination);o.start();
    g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+dur);
    o.stop(ac.currentTime+dur);
  }catch(e){}
}

/* ==================== 7. 寻路 ==================== */
function bfs(from,to){
  if(from===to)return[from];
  const q=[[from]],seen=new Set([from]);
  while(q.length){
    const p=q.shift(),cur=p[p.length-1];
    for(const [nb] of (und[cur]||[])){
      if(seen.has(nb)||st[nb].qUntil>G.t)continue;
      const np=p.concat([nb]);
      if(nb===to)return np;
      seen.add(nb);q.push(np);
    }
  }
  return null;
}
const isExt=id=>byId[id].cat==='external';
const otIds=()=>NODES.filter(n=>n.ot).map(n=>n.id);
const equipIds=()=>NODES.filter(n=>n.cat==='equipment').map(n=>n.id);
const plcIds=()=>NODES.filter(n=>n.cat==='plc').map(n=>n.id);
const itIds=()=>NODES.filter(n=>n.cat==='it_endpoint'||n.cat==='it_server').map(n=>n.id);
function nodesWithVuln(tag){
  return NODES.filter(n=>!isExt(n.id)&&st[n.id].vulns.includes(tag)
    &&st[n.id].qUntil<=G.t&&!st[n.id].comp).map(n=>n.id);
}
const compIds=pool=>NODES.filter(n=>!isExt(n.id)&&st[n.id].comp
  &&(!pool||pool.includes(n.id))).map(n=>n.id);

function pickRoute(type){
  if(type==='lateral'){
    const src=rnd(compIds()); if(!src)return null;
    const nb=(und[src]||[]).map(x=>x[0])
      .filter(id=>!isExt(id)&&!st[id].comp&&st[id].qUntil<=G.t);
    if(!nb.length)return null;
    return{entry:src,target:rnd(nb)};
  }
  if(type==='ip_theft'){                       // 从已失陷的数据资产外传
    const src=rnd(compIds(['rms','yms','historian','mes','litho']));
    if(!src)return null;
    return{entry:src,target:'internet'};
  }
  const M={
    phishing:{e:['oem_remote','internet'],t:['ews','pc_office','laptop']},
    bruteforce:{e:['oem_remote','internet'],t:['jumpserver','fw_edge','ad','ews']},
    ransomware:{e:['internet'],t:['erp','ad','ews','pc_office','mes']},
    exploit:{e:['internet','supplier'],t:nodesWithVuln('patch')},
    jump_abuse:{e:['ews'],t:['jumpserver','ot_sw']},
    usb_drop:{e:['laptop'],t:otIds().concat(['ot_sw','scada'])},
    secs_spoof:{e:['internet'],t:equipIds()},
    recipe_tamper:{e:['internet'],t:['rms','apc','recipe_terminal','litho']},
    plc_sabotage:{e:['internet'],t:plcIds()},
    facility_attack:{e:['internet'],t:['plc_upw','plc_hvac','plc_power','plc_chem']},
    supply_chain:{e:['supplier','oem_remote'],t:['eap','mes','avsrv','litho']},
    zeroday:{e:['internet'],t:['mes','rms','litho','plc_power','scada']},
  };
  const m=M[type]; if(!m)return null;
  const tl=m.t.filter(id=>!st[id].comp&&st[id].qUntil<=G.t);
  if(!tl.length)return null;
  return{entry:rnd(m.e),target:rnd(tl)};
}
function hiddenChance(){
  let p=0.15;
  if(G.wave>=5)p+=0.15;
  if(['siem','scada','historian'].some(id=>st[id].comp))p+=0.35;
  return p;
}
function nodeProgTime(def,id){
  if(isExt(id))return 0.75;
  const s=st[id];
  let t=def.prog*(WAVE_PROG[G.wave-1]||1);
  if(def.need&&s.vulns.includes(def.need))t*=0.62;
  else if(s.vulns.length===0)t*=1.45;
  if(s.comp)t*=0.6;
  return Math.max(1.2,t);
}

/* ==================== 8. 攻击系统 ==================== */
let atkSeq=0;
function trySpawn(type){
  if(G.attacks.length>=MAX_ALIVE)return 'full';
  const pool=WAVE_POOL[G.wave-1]||['exploit'];
  for(let k=0;k<6;k++){
    const ty=k===0?type:rnd(pool);
    const r=pickRoute(ty);
    if(!r)continue;
    const p=bfs(r.entry,r.target);
    if(!p||p.length<2)continue;
    createAtk(ty,p); return 'ok';
  }
  return 'noroute';
}
function createAtk(type,path){
  const def=ATTACKS[type];
  const hidden=Math.random()<hiddenChance();
  const a={id:++atkSeq,type,def,path:path.slice(),hop:0,state:'work',prog:0,
    moveT:0,life:0,hidden,rr:false,pt:nodeProgTime(def,path[0]),
    target:path[path.length-1],lt:0};
  G.attacks.push(a); mkAtkVis(a);
  if(hidden){
    log('⚠ 工业网络出现异常流量，攻击特征不明……','warn');
    toast('检测到未知威胁，需调查后处置','warn');
  }else{
    log(`${def.i} ${def.n} 自「${byId[path[0]].label}」发起 → 目标「${byId[a.target].label}」`,'bad');
    toast(`${def.i} ${def.n} 来袭！目标 ${byId[a.target].label}`,'bad');
  }
  sfx(180,.18,'sawtooth',.045);
  renderThreats();
}
const atkAt=id=>G.attacks.filter(a=>a.state==='work'&&a.path[a.hop]===id);
function rmAtk(a){
  const i=G.attacks.indexOf(a);
  if(i>=0)G.attacks.splice(i,1);
  rmAtkVis(a); renderThreats();
}
/* 阻断时机判定：越早反制代价越小 —— 快速响应的核心回报 */
function rewardBlock(a,why){
  const early=a.prog<0.35, late=a.prog>=0.75;
  const pts=early?80:(late?45:60);
  const tag=early?' ⚡早期阻断':(late?' ⚠惊险阻断':'');
  log(`✅ ${a.hidden?'未知威胁':a.def.n} 被阻断（${why}） +${pts}${tag}`,'ok');
  score(pts);
  if(!late)G.combo++;
  G.stats.blocked++;
  if(early){
    G.stats.early++;
    G.ap=Math.min(G.apMax,G.ap+0.5);
    log('⚡ 早期阻断：行动点 +0.5','ok');
  }
  if(late){
    G.stats.late++;
    bumpYield(-0.5);
    log('⚠ 惊险阻断：产线已受扰动，良率 -0.5%','warn');
  }
  sfx(early?880:720,.14,'square',.045);
  return early;
}
function blockAtk(a,why){rewardBlock(a,why);rmAtk(a);}
function finishObj(a,cur){
  const nm=byId[cur].label;
  if(!st[cur].comp){
    st[cur].comp=true;st[cur].nLat=G.t+rR(8,14);st[cur].nEx=G.t+rR(10,16);
    G.stats.comp.add(cur);
  }
  // 良率损失：只有真正命中产线（OT 现场设备 / 机台 / PLC / MES）才影响工艺
  const otHit=byId[cur].ot||['equipment','plc','scada','mes','ot_net'].includes(byId[cur].cat);
  if(a.def.yd>0&&otHit){
    bumpYield(-a.def.yd);
    log(`📉 ${a.def.n} 命中 ${nm}：良率 -${a.def.yd}%（当前 ${G.yield.toFixed(1)}%）`,'bad');
    toast(`${nm} 工艺受损！良率 -${a.def.yd}%`,'bad');
  }else{
    log(`🚨 ${a.def.n} 达成目标：${nm}`,'bad');
    toast(`${a.def.n} 得手：${nm}`,'bad');
  }
  if(a.type==='ip_theft')log('📤 制程配方与良率数据已泄露至外网！','bad');
  if(a.type==='facility_attack')log('🏭 厂务系统中断，洁净室环境失控，全线停产风险！','bad');
  G.combo=0;G.stats.leaks++;
  sfx(110,.3,'sawtooth',.06);
}
function completeHop(a){
  const cur=a.path[a.hop],last=a.hop===a.path.length-1;
  if(!isExt(cur)){
    let dmg=0;
    if(last)dmg=a.def.dmg;
    else if(a.hop>=2)dmg=a.def.dmg*0.12;
    const take=last||a.def.foothold;
    if(take&&!st[cur].comp){
      st[cur].comp=true;st[cur].nLat=G.t+rR(8,14);st[cur].nEx=G.t+rR(10,16);
      G.stats.comp.add(cur);
      log(`💀 ${byId[cur].label} 已被 ${a.hidden?'未知威胁':a.def.n} 控制`,'bad');
    }
    if(dmg>0){
      damage(dmg);
      log(`💥 ${byId[cur].label} 受损（-${dmg.toFixed(1)} 完整度）`,'bad');
      G.stats.dmg[a.type]=(G.stats.dmg[a.type]||0)+dmg;
    }
  }
  if(last){finishObj(a,cur);rmAtk(a);return;}
  const nx=a.path[a.hop+1];
  if(st[nx].qUntil>G.t)reroute(a);
  else{a.state='move';a.moveT=0;}
}
function reroute(a){
  if(!a.rr){
    a.rr=true;
    const p=bfs(a.path[a.hop],a.target);
    if(p&&p.length>=2){
      a.path=p.slice();a.hop=0;a.state='work';a.prog=0;a.pt=nodeProgTime(a.def,p[0]);
      log(`↩ ${a.hidden?'未知威胁':a.def.n} 绕行新路径（${p.length-1} 跳）`,'warn');
      return;
    }
  }
  a.state='linger';a.lt=5;a.life=Math.min(a.life,25);
  log(`⏸ ${a.hidden?'未知威胁':a.def.n} 无法抵达目标，在网络边界徘徊`,'warn');
}
function resolveTimeout(a){
  const cur=a.path[a.hop];
  if(!isExt(cur)){
    const d=a.def.dmg*0.3;
    damage(d);
    log(`⌛ ${a.def.n} 活动超时并就地造成破坏（-${d.toFixed(1)}）`,'warn');
  }
}

/* ==================== 9. 卡牌结算（含 OT 限制） ==================== */
/* 工业现场设备（PLC / 机台 / 仪表）无法在线打补丁，也无法安装终端代理 */
const OT_BAN=['patch','edr'];
function otBlocked(id,k){return !!byId[id].ot && OT_BAN.includes(k);}

function onNodeClick(id){
  G.sel=id; renderDev();
  if(!G.armed)return;
  applyCard(id,G.armed);
}
function validOn(id,k){
  if(isExt(id))return false;
  if(otBlocked(id,k))return false;
  if(k==='isolate')return true;
  const a=ACTIONS[k];
  if(atkAt(id).some(x=>x.hidden?k==='ids':x.def.ct.includes(k)))return true;
  if(a.cl.some(v=>st[id].vulns.includes(v)))return true;
  return false;
}
function applyCard(id,k,costExtra=0){
  const n=byId[id],a=ACTIONS[k];
  if(G.phase!=='wave'&&G.phase!=='prep')return;
  if(isExt(id)){toast('外部网络节点无法直接处置','warn');return;}
  // OT 现场设备限制 —— 核心教学点
  if(otBlocked(id,k)){
    G.stats.otBlocked++;
    const what=k==='patch'?'在线打补丁（会导致停机并失去厂商保修）':'安装终端检测代理';
    toast(`⚙ ${n.label} 是工业现场设备，无法${what} —— 请改用白名单、工业防火墙、网络隔离等补偿性控制措施`,'warn');
    log(`⚙ ${n.label} 无法${k==='patch'?'打补丁':'装代理'}：OT 现场设备需采用补偿性控制措施`,'warn');
    sfx(150,.09,'square',.025);
    return;
  }
  if(a.cdt>0){toast(`${a.n} 冷却中（${a.cdt.toFixed(1)}s）`,'warn');return;}
  const cost=a.cost+costExtra;
  if(G.ap<cost){toast(`行动点不足（需 ${cost}）`,'warn');sfx(140,.1,'square',.03);return;}

  if(k==='isolate'){
    atkAt(id).slice().forEach(x=>blockAtk(x,'设备隔离'));
    st[id].comp=false;st[id].qUntil=G.t+12000;
    G.stats.isolates++;
    const core=CORE_CATS.includes(n.cat)||n.ot;
    const d=core?5:1;
    damage(d);
    log(`🧯 已隔离 ${n.label}（离线 12s${core?'，产线中断 -5':''}）`,core?'warn':'ok');
    G.ap-=cost;a.cdt=a.cd;sfx(520,.12,'triangle',.05);
    return;
  }

  let eff=false;
  const hits=atkAt(id).filter(x=>x.hidden?k==='ids':x.def.ct.includes(k));
  if(hits.length){
    hits.forEach(x=>{
      if(x.hidden){x.hidden=false;log(`🔎 已识别未知威胁：${x.def.n}`,'ok');sfx(660,.12,'sine',.05);}
      blockAtk(x,`${a.n} 反制成功`);
    });
    eff=true;
  }
  const cl=a.cl.filter(v=>st[id].vulns.includes(v));
  if(cl.length){
    st[id].vulns=st[id].vulns.filter(v=>!a.cl.includes(v));
    score(40*cl.length);G.stats.hardened+=cl.length;
    log(`🛡 加固 ${n.label}：已消除 ${cl.map(v=>VULN[v]).join('、')} +${40*cl.length}`,'ok');
    eff=true;
  }
  if(eff&&st[id].comp&&['edr','restore','ids','recipe','patch','whitelist'].includes(k)){
    st[id].comp=false;G.stats.comp.delete(id);
    score(30);log(`✨ ${n.label} 已净化，恢复正常运行`,'ok');
  }
  // 工艺类恢复手段可回收部分良率
  if(eff&&(k==='recipe'||k==='restore')){
    const up=k==='recipe'?2:3;
    if(G.yield<100){
      bumpYield(up);
      log(`📈 ${n.label} 工艺参数复归，良率 +${up}%（当前 ${G.yield.toFixed(1)}%）`,'ok');
    }
  }
  if(eff){
    G.ap-=cost;a.cdt=a.cd;sfx(680,.12,'triangle',.05);
  }else{
    G.stats.inv++;
    toast(`「${a.n}」对 ${n.label} 无效 —— 未消耗行动点`,'warn');
    sfx(150,.09,'square',.025);
  }
}
function setArmed(k){
  G.armed=k;
  document.querySelectorAll('.card').forEach(c=>c.classList.toggle('armed',c.dataset.k===k));
  updateArmHints();
}
function updateArmHints(){
  NODES.forEach(n=>NV[n.id].g.classList.toggle('valid',G.armed?validOn(n.id,G.armed):false));
}

/* ==================== 10. 波次 ==================== */
function startGame(){
  Object.assign(G,{t:0,wave:0,hp:120,yield:92,ap:12,score:0,combo:0,attacks:[],queue:[],
    paused:false,sel:null,overReason:''});
  G.stats={comp:new Set(),dmg:{},leaks:0,blocked:0,hardened:0,inv:0,isolates:0,
    yieldLost:0,otBlocked:0,early:0,late:0};
  NODES.forEach(n=>{const s=st[n.id];
    s.vulns=(VULNS[n.id]||[]).slice();s.comp=false;s.qUntil=0;
    s.nLat=0;s.latWave=0;s.nEx=0;s.exWave=0;});
  Object.keys(ACTIONS).forEach(k=>ACTIONS[k].cdt=0);
  G.attacks.slice().forEach(rmAtk);
  $('#log').innerHTML='';
  setArmed(null);
  G.paused=false;updatePauseBtn();
  G.phase='prep';G.prepT=30;
  log('🔧 战前准备：按 ISA/IEC 62443 加固分区与管道，30 秒后第一波攻击到来','ok');
  hideOv();
}
function startWave(){
  G.wave++;G.phase='wave';G.waveT=0;G.ap=G.apMax;
  const pool=WAVE_POOL[G.wave-1],n=WAVE_ATK[G.wave-1];
  const iv=Math.max(2.0,5.6-0.6*G.wave);
  G.queue=[];
  for(let i=0;i<n;i++)G.queue.push({t:i*iv+Math.random()*iv*0.4,type:rnd(pool)});
  log(`⚔ 第 ${G.wave} 波攻击开始（${n} 项威胁）`,'bad');
  toast(`第 ${G.wave} 波攻击开始！`,'bad');
  sfx(220,.3,'sawtooth',.055);
}
function endWave(){
  const c=NODES.filter(n=>st[n.id].comp).length;
  G.hp=Math.min(G.hpMax,G.hp+10);score(200);
  log(`✅ 第 ${G.wave} 波防御成功（+8 完整度，+200 分）`,'ok');
  // 良率结算：产线干净则工艺复归，仍有设备失陷则持续掉良率
  if(c===0){bumpYield(1);log(`📈 产线完全净化，良率复归 +1%（当前 ${G.yield.toFixed(1)}%）`,'ok');}
  else{const y=+Math.min(c*0.8,6).toFixed(1);bumpYield(-y);
    log(`⚠ 波次结算：${c} 台设备仍失陷，良率 -${y}%（当前 ${G.yield.toFixed(1)}%）`,'warn');}
  const pen=Math.min(c*2,14);
  if(pen>0){damage(pen);log(`⚠ 波次结算：${c} 台设备仍失陷（-${pen} 完整度）`,'warn');}
  if(G.phase==='over')return;
  if(G.wave>=WAVE_COUNT){gameOver(true);return;}
  G.phase='prep';G.prepT=25;
  log('🔧 进入准备阶段（25s），可提前开始下一波','ok');
}
function gameOver(win,reason){
  G.phase='over';G.overReason=reason||'';
  G.attacks.slice().forEach(rmAtk);G.queue=[];
  setArmed(null);
  showResult(win);
}

/* ==================== 11. 主循环 ==================== */
function update(dt){
  const regen=(G.phase==='prep'?0.7:0.58);
  G.ap=Math.min(G.apMax,G.ap+regen*dt);
  for(const k in ACTIONS)if(ACTIONS[k].cdt>0)ACTIONS[k].cdt=Math.max(0,ACTIONS[k].cdt-dt);

  if(G.phase==='prep'){
    G.prepT-=dt;
    if(G.prepT<=0)startWave();
  }
  if(G.phase==='wave'){
    G.waveT+=dt;
    while(G.queue.length&&G.queue[0].t<=G.waveT){
      const it=G.queue.shift();
      const r=trySpawn(it.type);
      if(r==='full'){G.queue.unshift(it);break;}
      if(r==='noroute'){score(50);log('🛡 攻击未能找到可达路径，分区隔离生效 +50','ok');}
    }
    NODES.forEach(n=>{
      const s=st[n.id];
      if(!s.comp)return;
      if(s.latWave!==G.wave&&G.t>=s.nLat){
        s.latWave=G.wave;
        if(Math.random()<0.65)trySpawn('lateral'); else s.nLat=G.t+8000;
      }
      if(G.wave>=4&&['rms','yms','historian','mes','litho'].includes(n.id)
        &&s.exWave!==G.wave&&G.t>=s.nEx){
        s.exWave=G.wave;
        if(Math.random()<0.6)trySpawn('ip_theft'); else s.nEx=G.t+10000;
      }
    });
    // 产线在攻击压力下持续波动：威胁滞留越久、数量越多，良率流失越快
    if(G.phase==='wave'){
      const live=G.attacks.filter(a=>a.state!=='linger').length;
      if(live)bumpYield(-live*0.035*dt);
    }
    if(G.phase==='wave'&&!G.queue.length&&!G.attacks.length)endWave();
  }

  for(let i=G.attacks.length-1;i>=0;i--){
    if(G.phase==='over')break;
    const a=G.attacks[i];
    if(!a)break;
    a.life+=dt;
    if(a.life>ATK_LIFE){resolveTimeout(a);rmAtk(a);continue;}
    if(a.state==='work'){
      const cur=a.path[a.hop];
      if(st[cur].qUntil>G.t){blockAtk(a,'设备已被隔离');continue;}
      a.prog+=dt/a.pt;
      if(a.prog>=1)completeHop(a);
    }else if(a.state==='move'){
      a.moveT+=dt/0.55;
      if(a.moveT>=1){
        a.hop++;a.state='work';a.prog=0;
        const nx=a.path[a.hop];
        if(st[nx].qUntil>G.t)reroute(a);
        else a.pt=nodeProgTime(a.def,nx);
      }
    }else if(a.state==='linger'){
      a.lt-=dt;damage(0.3*dt);
      if(a.lt<=0){
        const p=bfs(a.path[a.hop],a.target);
        if(p&&p.length>=2){
          a.path=p.slice();a.hop=0;a.state='work';a.prog=0;
          a.pt=nodeProgTime(a.def,p[0]);a.life=Math.min(a.life,30);
          log(`🔁 ${a.def.n} 重新找到路径，继续渗透`,'warn');
        }else a.lt=5;
      }
    }
  }
}

/* ==================== 12. 渲染 ==================== */
function render(){
  $('#hWave').textContent=`${G.wave}/${WAVE_COUNT}`;
  $('#hHp').textContent=Math.ceil(G.hp);
  $('#bHp').style.width=(G.hp/G.hpMax*100)+'%';
  $('#hYd').textContent=G.yield.toFixed(1)+'%';
  $('#bYd').style.width=G.yield+'%';
  $('#hAp').textContent=Math.floor(G.ap);
  $('#bAp').style.width=(G.ap/G.apMax*100)+'%';
  $('#hScore').textContent=G.score;
  $('#hCombo').textContent='×'+comboMul().toFixed(1);
  const pt=$('#phaseTag');
  if(G.phase==='prep'){pt.className='prep';pt.textContent=`准备中 ${Math.ceil(G.prepT)}s`;}
  else if(G.phase==='wave'){pt.className='wave';
    pt.textContent=`第 ${G.wave} 波交战中 · 剩余 ${G.queue.length+G.attacks.length}`;}
  else if(G.phase==='paused'){pt.className='';pt.textContent='已暂停';}
  else{pt.className='';pt.textContent='演练结束';}

  NODES.forEach(n=>{
    const s=st[n.id],v=NV[n.id];
    const al=atkAt(n.id);                       // 该节点上所有进行中的攻击
    const a=al.length?al.reduce((m,x)=>x.prog>m.prog?x:m):null;  // 取进度最深的（最紧急）
    let fill='#152541',stroke=COLOR[n.cat],sw=1.6,badge='';
    if(s.qUntil>G.t){fill='#141419';stroke='#5a6b7f';badge='🔒';}
    else if(s.comp){fill='#3a1220';stroke='#ff4d6d';sw=3;badge='💀';}
    else if(a){
      stroke=a.hidden?'#ff9f43':a.def.c;sw=3.2;
      badge=(a.hidden?'❓':'⚠')+(al.length>1?al.length:'');   // 多路攻击叠加时显示数量
    }
    if(!s.comp&&s.qUntil<=G.t&&!s.vulns.length&&!al.length)badge=badge||'🛡';
    v.box.setAttribute('fill',fill);
    v.box.setAttribute('stroke',stroke);
    v.box.setAttribute('stroke-width',sw);
    v.bd.textContent=badge;

    if(a){
      v.pg.setAttribute('display','');
      v.pf.setAttribute('width',152*Math.min(1,a.prog));
      v.pf.setAttribute('fill',a.hidden?'#ff9f43':a.def.c);
    }else v.pg.setAttribute('display','none');

    const want=s.vulns.length;
    if(v.vg.childNodes.length!==want){
      v.vg.textContent='';
      s.vulns.forEach((_,i)=>v.vg.appendChild(
        el('circle',{cx:-76+i*11,cy:26,r:3.2,fill:'#ff9f43',opacity:.85})));
    }
    v.vg.setAttribute('display',a?'none':'');
  });

  G.attacks.forEach(a=>{
    const v=AV[a.id]; if(!v)return;
    let x,y;
    if(a.state==='move'){
      const p1=pos[a.path[a.hop]],p2=pos[a.path[a.hop+1]],t=a.moveT;
      x=p1.x+(p2.x-p1.x)*t; y=p1.y+(p2.y-p1.y)*t;
    }else{const p=pos[a.path[a.hop]];x=p.x;y=p.y-4;}
    v.halo.setAttribute('cx',x);v.halo.setAttribute('cy',y);
    v.dot.setAttribute('cx',x);v.dot.setAttribute('cy',y);
    v.txt.setAttribute('x',x);v.txt.setAttribute('y',y-23);
    v.txt.textContent=a.hidden?'❓ 未知':a.def.i+' '+a.def.n;
    if(a.hidden){
      v.pth.setAttribute('display','none');
      v.dot.setAttribute('fill','#ff9f43');
    }else{
      v.pth.setAttribute('display','');
      v.dot.setAttribute('fill',a.def.c);
      let d='';
      for(let i=a.hop;i<a.path.length;i++){
        const p=pos[a.path[i]];
        d+=(i===a.hop?'M':'L')+p.x+','+p.y+' ';
      }
      v.pth.setAttribute('d',d);
    }
    v.pth.setAttribute('stroke',a.def.c);
  });

  updateThreatBars();updateCards();
}
function updateCards(){
  document.querySelectorAll('.card').forEach(c=>{
    const a=ACTIONS[c.dataset.k];
    c.classList.toggle('no',G.ap<a.cost||a.cdt>0);
    c.querySelector('.cd').style.height=(a.cdt>0?a.cdt/a.cd*100:0)+'%';
  });
}
function recCard(a){
  if(a.hidden)return{k:'ids',a:ACTIONS.ids};
  for(const k of a.def.ct){
    if(ACTIONS[k].cdt<=0&&!otBlocked(a.path[a.hop],k))return{k,a:ACTIONS[k]};
  }
  return null;
}
function renderThreats(){
  const box=$('#threats');
  $('#thN').textContent=G.attacks.length;
  if(!G.attacks.length){box.innerHTML='<div class="empty">暂无活跃威胁</div>';return;}
  box.innerHTML='';
  G.attacks.forEach(a=>{
    const cur=a.path[a.hop],tgt=a.target;
    const d=document.createElement('div');
    d.className='threat'+(a.hidden?' hid':'');
    const rec=recCard(a);
    const showName=a.hidden?'未知威胁':a.def.n;
    const showIcon=a.hidden?'❓':a.def.i;
    let actHtml;
    if(a.hidden)actHtml=`<button class="th-act" data-act="__hunt">🔎<b>调查 1</b></button>`;
    else if(rec)actHtml=`<button class="th-act" data-act="${rec.k}">${rec.a.i}<b>${rec.a.cost+1} AP</b></button>`;
    else actHtml=`<button class="th-act" disabled>—<b>需研判</b></button>`;
    const yd=a.def.yd>0?` <span style="color:#5ec8f0">良率-${a.def.yd}%</span>`:'';
    d.innerHTML=`
      <div class="th-ic">${showIcon}</div>
      <div class="th-main">
        <div class="th-t">${showName}${yd} <span class="ar">→</span> ${byId[cur].label}
          <span class="ar">/ 目标</span> ${byId[tgt].label}</div>
        <div class="th-bar"><i data-bar="${a.id}"
          style="width:${(a.prog*100).toFixed(0)}%;background:${a.hidden?'#ff9f43':a.def.c}"></i></div>
      </div>
      ${G.hint?actHtml:`<button class="th-act" data-act="__locate">📍<b>定位</b></button>`}`;
    d.addEventListener('click',e=>{
      const b=e.target.closest('.th-act');
      locate(a.path[a.hop]);
      if(!b||b.disabled||!b.dataset.act)return;
      e.stopPropagation();
      if(b.dataset.act==='__locate')return;
      if(b.dataset.act==='__hunt'){
        if(G.ap<1){toast('行动点不足','warn');return;}
        G.ap-=1;a.hidden=false;renderThreats();
        log(`🔎 调查完成，威胁已识别：${a.def.n}`,'ok');sfx(660,.12,'sine',.05);
        return;
      }
      applyCard(a.path[a.hop],b.dataset.act,1);
    });
    box.appendChild(d);
  });
}
function updateThreatBars(){
  G.attacks.forEach(a=>{
    const i=document.querySelector(`[data-bar="${a.id}"]`);
    if(i)i.style.width=(Math.min(1,a.prog)*100).toFixed(0)+'%';
  });
}
let locateT=0;
function locate(id){
  NODES.forEach(n=>NV[n.id].g.classList.remove('locate'));
  NV[id].g.classList.add('locate');
  clearTimeout(locateT);
  locateT=setTimeout(()=>NV[id].g.classList.remove('locate'),1600);
  G.sel=id;renderDev();
}
function renderDev(){
  const box=$('#devInfo');
  if(!G.sel){box.innerHTML='<div class="empty">点击拓扑节点查看详情</div>';return;}
  const n=byId[G.sel],s=st[G.sel];
  const q=s.qUntil>G.t,c=s.comp;
  const stateTxt=q?'🔒 已隔离':(c?'💀 已失陷':'✅ 正常');
  const stateCls=q?'':(c?'vk':'vs');
  const vs=s.vulns.length?s.vulns.map(v=>`<span class="vchip">${VULN[v]}</span>`).join('')
    :'<span class="vchip ok">已全面加固</span>';
  const otNote=n.ot?`<div class="otnote">⚙ 工业现场设备：无法在线打补丁 / 安装 EDR 代理<br>
    请改用「应用白名单」「工业防火墙」「网络微隔离」等补偿性控制措施</div>`:'';
  box.innerHTML=`<div class="nm">${n.icon} ${n.label}</div>
    <div class="mut">${CAT[n.cat]} · ${n.ip} · <span class="${stateCls}">${stateTxt}</span></div>
    <div style="margin-top:4px">弱点：${vs}</div>${otNote}`;
}

/* ==================== 13. 提示 ==================== */
function showTip(n,e){
  const s=st[n.id];
  const q=s.qUntil>G.t;
  const vs=s.vulns.length?s.vulns.map(v=>VULN[v]).join('、'):'已全面加固';
  const stx=q?'🔒 已隔离':(s.comp?'💀 已失陷':'✅ 正常');
  const atk=atkAt(n.id);
  const atx=atk.length?`<div style="margin-top:3px">⚠ 正遭受：${atk.map(a=>a.hidden?'未知威胁':a.def.n).join('、')}</div>`:'';
  const ot=n.ot?`<div style="margin-top:3px;color:var(--cy)">⚙ 现场设备：不可打补丁 / 装代理</div>`:'';
  $('#tip').innerHTML=`<div class="t">${n.icon} ${n.label}</div>
    <div style="color:var(--muted)">${CAT[n.cat]} · ${n.ip}</div>
    <div>状态：${stx}</div><div>弱点：${vs}</div>${atx}${ot}`;
  $('#tip').style.display='block';moveTip(e);
}
function moveTip(e){
  const t=$('#tip'),r=$('#stage').getBoundingClientRect();
  let x=e.clientX-r.left+16,y=e.clientY-r.top+14;
  if(x+t.offsetWidth>r.width-8)x=e.clientX-r.left-t.offsetWidth-14;
  if(y+t.offsetHeight>r.height-8)y=e.clientY-r.top-t.offsetHeight-12;
  t.style.left=x+'px';t.style.top=y+'px';
}
function hideTip(){$('#tip').style.display='none';}

function buildCards(){
  const box=$('#cards');
  box.innerHTML='';
  Object.entries(ACTIONS).forEach(([k,a])=>{
    const c=document.createElement('div');
    c.className='card';c.dataset.k=k;
    c.innerHTML=`<div class="cd"></div><div class="ck">${a.k}</div>
      <div class="ci">${a.i}</div><div class="cn">${a.n}</div>
      <div class="cc">${a.cost} AP${a.cd>1?' · CD'+a.cd+'s':''}</div>`;
    c.addEventListener('click',()=>setArmed(G.armed===k?null:k));
    c.addEventListener('mouseenter',()=>{$('#cardTip').textContent=a.d;});
    box.appendChild(c);
  });
}

/* ==================== 14. 遮罩 ==================== */
function showOv(html){$('#ovBox').innerHTML=html;$('#ov').classList.add('show');}
function hideOv(){$('#ov').classList.remove('show');}
function showStart(){
  showOv(`<h2>🏭 晶圆厂网络安全攻防演练</h2>
  <p>你是晶圆厂（Fab）的<b>信息安全与 OT 安全负责人</b>。攻击者正沿
  <b>IT → IDMZ → MES → OT 控制网 → 机台</b> 的杀伤链逐级渗透。
  你有两条命脉要守：<b>产线完整度</b>与<b>良率</b>，共 6 波攻击。</p>

  <div class="note"><b>⚙ 这个版本和 IT 企业版最不一样的地方：OT 设备不能打补丁。</b><br>
  PLC 控制器、光刻机、刻蚀机等现场设备一旦上线就要连续运行数月，
  <b>无法在线打补丁（会停机且失去厂商保修），也无法安装 EDR 代理</b>。
  对它们使用「补丁管理」或「EDR 查杀」会被拒绝 ——
  必须改用 <b>应用白名单、工业防火墙协议防护、网络微隔离</b> 等补偿性控制措施。
  这正是工业控制系统安全的核心思路。</div>

  <h3>怎么玩</h3>
  <ul>
    <li><b>备战阶段</b>（30s / 25s）：没有攻击，用行动点加固弱点 —— 弱点越少，后续攻击推进越慢。</li>
    <li><b>交战阶段</b>：攻击沿虚线路径逐跳推进，每跳读条；读条满则该设备<b>失陷</b>并继续深入。</li>
    <li>选中一张<b>防御卡</b>（或按数字键），再点击目标设备施放；克制对了才能摧毁攻击。</li>
    <li>也可在右侧<b>威胁列表</b>一键反制（便利性代价 +1 AP）。</li>
    <li><b>前两跳几乎不掉血</b>（侦察期）。但会沿途建立据点的攻击类型必须尽早拦。</li>
    <li>配方篡改、PLC 破坏、SECS/GEM 伪造、厂务攻击会直接打掉<b>良率</b>；
       用「配方校验」「备份恢复」可以复归良率。</li>
  </ul>

  <h3>三条命脉</h3>
  <ul>
    <li><b>产线完整度</b>归零 → 全面停产，失败。</li>
    <li><b>良率</b>跌破 ${YIELD_FAIL}% → 良率崩盘，失败。</li>
    <li><b>EUV 光刻机、配方管理库、良率数据库</b>是最核心资产，一旦失陷损失惨重。</li>
  </ul>

  <div class="btnrow">
    <button class="btn" onclick="startGame()">开始演练</button>
    <button class="btn gh" onclick="showManual()">📖 攻防手册</button>
  </div>`);
}
function showManual(){
  const atkRows=Object.entries(ATTACKS).map(([k,a])=>
    `<tr><td>${a.i} ${a.n}</td><td>${a.need?VULN[a.need]:'—'}</td><td>${a.dmg}</td>
     <td>${a.yd>0?'<b style="color:#5ec8f0">-'+a.yd+'%</b>':'—'}</td>
     <td>${a.foothold?'<b>是</b>':'否'}</td>
     <td>${a.ct.map(c=>ACTIONS[c].i+ACTIONS[c].n).join('、')}</td>
     <td style="font-size:11px;color:#8098b8">${a.d}</td></tr>`).join('');
  const actRows=Object.entries(ACTIONS).map(([k,a])=>
    `<tr><td>${a.i} ${a.n}</td><td>${a.cost}</td>
     <td>${a.cl.length?a.cl.map(v=>VULN[v]).join('、'):'<span style="color:#8098b8">万能</span>'}</td>
     <td>${OT_BAN.includes(k)?'<b style="color:#5ec8f0">OT 设备上不可用</b>':''}${a.d}</td></tr>`).join('');
  showOv(`<h2>📖 晶圆厂攻防手册</h2>
  <h3>攻击方式 → 有效反制</h3>
  <table><tr><th>攻击</th><th>利用弱点</th><th>完整度伤害</th><th>良率</th><th>沿途失陷</th>
  <th>有效反制</th><th>说明</th></tr>${atkRows}</table>
  <h3>防御手段</h3>
  <table><tr><th>手段</th><th>消耗</th><th>可清除弱点</th><th>说明</th></tr>${actRows}</table>
  <h3>伤害模型与分区</h3>
  <p>第 1–2 跳为<b>侦察期，零伤害</b>；第 3 跳起每跳 0.12 倍；<b>终点全额</b>。
  拓扑按 ISA/IEC 62443 分为 企业 IT 区 / IDMZ 工业隔离区 / MES 制造执行层 /
  OT 过程控制网 / 机台设备区。<b>单向数据网关</b>（虚线箭头）只允许数据从历史数据库流向 IT 侧，
  攻击者<b>无法反向穿越</b>。</p>
  <div class="btnrow"><button class="btn" onclick="closeManual()">返回</button></div>`);
}
function closeManual(){backOv();}
function showResult(win){
  const s=G.stats;
  const dmgEnt=Object.entries(s.dmg).sort((a,b)=>b[1]-a[1]);
  const worst=dmgEnt.length?`${ATTACKS[dmgEnt[0][0]].i} ${ATTACKS[dmgEnt[0][0]].n}（${dmgEnt[0][1].toFixed(1)} 伤害）`:'无';
  const safe=NODES.filter(n=>!s.comp.has(n.id)&&!isExt(n.id)).length;
  const tot=NODES.filter(n=>!isExt(n.id)).length;
  const ydScore=G.yield>=90?1:(G.yield>=75?0.7:0.4);
  const eff=G.score*(0.6+0.4*ydScore);
  let rank='D',rc='#ff4d6d';
  if(win){
    if(eff>=8200&&G.yield>=88){rank='S';rc='#ffd166';}
    else if(eff>=5600){rank='A';rc='#4cd964';}
    else if(eff>=3600){rank='B';rc='#2bd9c9';}
    else if(eff>=1800){rank='C';rc='#4aa3ff';}
  }else{rank='F';rc='#ff4d6d';}
  const rec=dmgEnt.slice(0,3).map(([k])=>{
    const a=ATTACKS[k];
    return `${a.ct.map(c=>ACTIONS[c].n).join('/')}（防 ${a.n}）`;
  }).join('　→　')||'—';
  showOv(`<h2>${win?'🎉 演练成功':'💀 防线失守'}</h2>
  <p>${win?`你守住了晶圆厂，扛过全部 ${WAVE_COUNT} 波攻击。`
    :`${G.overReason||'防线被击穿'} —— 攻击在第 ${G.wave} 波得手。`}</p>
  <div class="rank" style="color:${rc}">${rank}</div>
  <div class="kv2">
    <div><b>${G.score}</b>总得分</div>
    <div><b>${G.yield.toFixed(1)}%</b>最终良率</div>
    <div><b>${Math.ceil(G.hp)}</b>剩余产线完整度</div>
    <div><b>${s.blocked}</b>成功阻断攻击数</div>
    <div><b>${s.hardened}</b>消除弱点数</div>
    <div><b>${safe}/${tot}</b>从未失陷的设备</div>
    <div><b>${s.leaks}</b>攻击得手次数</div>
    <div><b>${s.yieldLost.toFixed(1)}%</b>累计良率损失</div>
    <div><b>${s.isolates}</b>紧急隔离次数</div>
    <div><b>${s.otBlocked}</b>OT 设备误用补丁/EDR</div>
    <div><b>${s.inv}</b>无效处置次数</div>
  </div>
  <h3>最致命的攻击类型</h3><p>${worst}</p>
  <h3>建议优先加固</h3><p>${rec}</p>
  ${s.otBlocked>0?`<div class="note"><b>复盘提示：</b>你有 ${s.otBlocked} 次对 PLC / 机台使用了补丁管理或 EDR。
  工业现场设备无法安装代理或在线打补丁，正确做法是改用
  <b>应用白名单</b>（抵御未知程序与 U 盘摆渡）、<b>工业防火墙</b>（协议级防护）
  和 <b>网络微隔离</b>。</div>`:''}
  <div class="btnrow">
    <button class="btn" onclick="startGame()">再来一次</button>
    <button class="btn gh" onclick="showManual()">📖 查看手册</button>
  </div>`);
  sfx(win?880:120,.5,win?'triangle':'sawtooth',.06);
}

/* ==================== 15. 缩放平移 ==================== */
const svg=$('#svg'),vp=$('#viewport');
let sc=1,tx=0,ty=0;
const applyT=()=>vp.setAttribute('transform',`translate(${tx},${ty}) scale(${sc})`);
svg.addEventListener('wheel',e=>{
  e.preventDefault();
  const r=svg.getBoundingClientRect();
  const mx=(e.clientX-r.left)/r.width*1700,my=(e.clientY-r.top)/r.height*980;
  const f=e.deltaY<0?1.13:1/1.13;
  const ns=Math.min(3,Math.max(.45,sc*f));
  tx=mx-(mx-tx)*(ns/sc);ty=my-(my-ty)*(ns/sc);sc=ns;applyT();
},{passive:false});
let drag=false,sx,sy,moved=0;
svg.addEventListener('mousedown',e=>{drag=true;moved=0;sx=e.clientX-tx;sy=e.clientY-ty;
  svg.classList.add('grabbing');hideTip();});
window.addEventListener('mousemove',e=>{
  if(!drag)return;
  const nx=e.clientX-sx,ny=e.clientY-sy;
  moved+=Math.abs(nx-tx)+Math.abs(ny-ty);tx=nx;ty=ny;applyT();
});
window.addEventListener('mouseup',()=>{drag=false;svg.classList.remove('grabbing');});
svg.addEventListener('click',()=>{if(moved<=6&&G.armed)setArmed(null);});
$('#bFs').onclick=()=>{
  if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();
  else document.exitFullscreen?.();
};

/* ==================== 16. 控制 ==================== */
function updatePauseBtn(){
  $('#bPause').textContent=G.paused?'▶ 继续':'⏸ 暂停';
  $('#bPause').classList.toggle('on',G.paused);
}
function showPauseOv(){
  showOv(`<h2>⏸ 已暂停</h2>
    <p>第 ${G.wave} 波 · 产线完整度 ${Math.ceil(G.hp)} · 良率 ${G.yield.toFixed(1)}% · 得分 ${G.score}</p>
    <div class="btnrow">
      <button class="btn" onclick="togglePause()">继续</button>
      <button class="btn gh" onclick="showManual()">📖 攻防手册</button>
      <button class="btn gh" onclick="askRestart()">重新开始</button>
    </div>`);
}
let wasPaused=false;
function togglePause(){
  if(G.phase==='menu'||G.phase==='over')return;
  G.paused=!G.paused;updatePauseBtn();
  if(G.paused)showPauseOv();else hideOv();
}
function backOv(){
  if(G.phase==='menu'){showStart();return;}
  G.paused=wasPaused;updatePauseBtn();
  if(wasPaused)showPauseOv();else hideOv();
}
function askRestart(){
  if(G.phase!=='menu'&&G.phase!=='over'){G.paused=true;updatePauseBtn();}
  showOv(`<h2>重新开始？</h2><p>当前进度将丢失。</p>
    <div class="btnrow"><button class="btn" onclick="startGame()">确认重开</button>
    <button class="btn gh" onclick="backOv()">取消</button></div>`);
}
$('#bPause').onclick=togglePause;
$('#bManual').onclick=()=>{
  wasPaused=G.paused;
  if(G.phase!=='menu'&&G.phase!=='over'){G.paused=true;updatePauseBtn();}
  showManual();
};
$('#bHint').onclick=function(){G.hint=!G.hint;this.classList.toggle('on',G.hint);renderThreats();};
$('#bSfx').onclick=function(){G.sfx=!G.sfx;this.classList.toggle('on',G.sfx);};
$('#bRestart').onclick=askRestart;
window.addEventListener('keydown',e=>{
  if(e.key===' '){e.preventDefault();togglePause();return;}
  if(e.key==='Escape'){setArmed(null);
    if($('#ov').classList.contains('show')&&G.phase!=='menu'&&G.phase!=='over'&&!G.paused)hideOv();
    return;}
  if(G.phase==='menu'||G.phase==='over')return;
  const ak=Object.keys(ACTIONS).find(k=>ACTIONS[k].k===e.key);
  if(ak){setArmed(G.armed===ak?null:ak);return;}
  if(e.key.toLowerCase()==='h')showManual();
  if(e.key==='Tab'){
    e.preventDefault();
    if(G.attacks.length){
      const i=(G.attacks.findIndex(a=>a.path[a.hop]===G.sel)+1)%G.attacks.length;
      locate(G.attacks[i].path[G.attacks[i].hop]);
    }
  }
});

/* ==================== 17. 启动 ==================== */
buildCards();renderThreats();renderDev();showStart();
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const raw=Math.min(60,now-last);last=now;
  if(!G.paused&&G.phase!=='menu'&&G.phase!=='over'){
    G.t+=raw;update(raw/1000);
    if(G.armed)updateArmHints();
  }
  render();
}
requestAnimationFrame(frame);
</script>
